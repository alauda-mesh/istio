name: Pull Request Builder

on:
  pull_request:
    branches: ["istio-1.28*"]

env:
  http_proxy: ${{ vars.http_proxy }}
  https_proxy: ${{ vars.https_proxy }}
  no_proxy: ${{ vars.no_proxy }}
  IMAGE_REPOSITORY: build-harbor.alauda.cn/asm
  DOCKER_BUILD_VARIANTS: distroless
  DOCKER_TARGETS: "install-cni istioctl pilot proxyv2 ztunnel"

jobs:
  build:
    name: Build
    runs-on: [self-hosted, linux, x64]
    outputs:
      image: ${{ steps.output_images.outputs.image }}
      images: ${{ steps.output_images.outputs.images }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Add image provenance metadata
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          while IFS= read -r dockerfile; do
            if [[ ! -f "${dockerfile}" ]]; then
              echo "Dockerfile not found: ${dockerfile}" >&2
              exit 1
            fi
            {
              printf '\n'
              printf 'LABEL org.opencontainers.image.source="%s"\n' "${SOURCE_REPOSITORY}"
              printf 'LABEL org.opencontainers.image.revision="%s"\n' "${SOURCE_REVISION}"
              printf 'LABEL org.opencontainers.image.ref.name="%s"\n' "${SOURCE_REF}"
            } >> "${dockerfile}"
          done < <(
            awk '
              /^images:/ { in_images = 1; next }
              in_images && $1 == "dockerfile:" { print $2 }
            ' tools/docker.yaml | sort -u
          )

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Install GH CLI
        uses: dev-hanz-ops/install-gh-cli-action@v0.3.0

      - name: Login Harbor
        uses: docker/login-action@v4
        with:
          registry: build-harbor.alauda.cn
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Git describe
        id: ghd
        uses: proudust/gh-describe@v3

      - name: Setup Image Tag
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ "${{ github.event_name }}" == "push" && "${{ startsWith(github.ref, 'refs/heads/') }}" == "true" ]]; then
            VERSION=${{ steps.ghd.outputs.describe }}
            TAG=$(echo "${VERSION}" | sed -E 's/-([0-9]+)-g/-alpha.\1./; s/-g/./')
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            VERSION=${{ steps.ghd.outputs.tag }}
            PR_ID=${{ github.event.pull_request.number }}
            BUILD_NO=${{ github.run_number }}
            TAG="${VERSION}-pr.${PR_ID}.${BUILD_NO}"
          else
            echo "Unknown tag"
            exit 1
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Build and Push
        env:
          HUB: ${{ env.IMAGE_REPOSITORY }}
          ISTIO_BASE_REGISTRY: ghcr.io/alauda-mesh
          BASE_VERSION: 2026-07-15T08-33-44
          TOOLS_REGISTRY_PROVIDER: gcr.m.daocloud.io
          # 升级 build-tools 至上游 release-1.28 最新（Go 1.25.10）
          IMAGE_VERSION: release-1.28-879cab1fff4bf7578feb9973cac1e413b6e16147
          # 覆盖镜像内 GOTOOLCHAIN=local
          GOTOOLCHAIN: go1.26.6
          # 关闭主模块 VCS 版本嵌入，消除 istio.io/istio 伪版本导致的 Trivy 误报（CVE-2021-39156 等）
          GOBUILDFLAGS: "-buildvcs=false"
          DOCKER_ARCHITECTURES: linux/amd64,linux/arm64
          # For report_build_info.sh
          IGNORE_DIRTY_TREE: "1"
          GIT_DESCRIBE_TAG: ${{ env.TAG }}
          EXTRA_RELEASE_LDFLAGS: ${{ vars.EXTRA_RELEASE_LDFLAGS }}
        run: |
          make docker.push

      - name: "Output image: ${{ env.IMAGE_REPOSITORY }}/proxyv2:${{ env.TAG }}-distroless"
        id: output_images
        shell: bash
        env:
          IMAGE_TAG: ${{ env.TAG }}
          PRIMARY_IMAGE: ${{ env.IMAGE_REPOSITORY }}/proxyv2:${{ env.TAG }}-distroless
        run: |
          images=()
          for image_name in ${DOCKER_TARGETS}; do
            image="${IMAGE_REPOSITORY}/${image_name}:${IMAGE_TAG}-distroless"
            images+=("${image}")
            echo "BUILD_IMAGE=${image}"
          done

          printf -v images_json '"%s",' "${images[@]}"
          images_json="[${images_json%,}]"
          echo "image=${PRIMARY_IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "images=${images_json}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Build images"
            echo
            printf -- '- `%s`\n' "${images[@]}"
          } >> "${GITHUB_STEP_SUMMARY}"

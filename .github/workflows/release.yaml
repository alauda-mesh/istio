name: Release Alauda Istio

on:
  release:
    types: [ created ]

env:
  http_proxy: ${{ vars.http_proxy }}
  https_proxy: ${{ vars.https_proxy }}
  no_proxy: ${{ vars.no_proxy }}
  IMAGE_REPOSITORY: build-harbor.alauda.cn/asm

jobs:
  release:
    name: Release
    runs-on: [ self-hosted, linux, x64 ]
    outputs:
      image: ${{ steps.output_images.outputs.image }}
      images: ${{ steps.output_images.outputs.images }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Add artifact provenance metadata
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          while IFS= read -r dockerfile; do
            if [[ ! -f "${dockerfile}" ]]; then
              echo "Dockerfile not found: ${dockerfile}" >&2
              exit 1
            fi
            {
              printf '\n'
              printf 'LABEL org.opencontainers.image.source="%s"\n' "${SOURCE_REPOSITORY}"
              printf 'LABEL org.opencontainers.image.revision="%s"\n' "${SOURCE_REVISION}"
              printf 'LABEL org.opencontainers.image.ref.name="%s"\n' "${SOURCE_REF}"
            } >> "${dockerfile}"
          done < <(
            awk '
              /^images:/ { in_images = 1; next }
              in_images && $1 == "dockerfile:" { print $2 }
            ' tools/docker.yaml | sort -u
          )

          while IFS= read -r -d '' chart; do
            {
              printf '\nannotations:\n'
              printf '  org.opencontainers.image.source: "%s"\n' "${SOURCE_REPOSITORY}"
              printf '  org.opencontainers.image.revision: "%s"\n' "${SOURCE_REVISION}"
              printf '  org.opencontainers.image.ref.name: "%s"\n' "${SOURCE_REF}"
            } >> "${chart}"
          done < <(
            find manifests/charts manifests/sample-charts \
              -type f -name Chart.yaml -print0
          )

      - name: Install GH CLI
        uses: dev-hanz-ops/install-gh-cli-action@v0.2.1

      - name: Login Harbor
        uses: docker/login-action@v4
        with:
          registry: build-harbor.alauda.cn
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Git describe
        id: ghd
        uses: proudust/gh-describe@v3

      - name: Setup Image Tag
        run: |
          echo "TAG=${{ steps.ghd.outputs.tag }}" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          cache-image: false

      - name: Set up Docker Buildx
        run: |
          if ! docker buildx ls | grep -q container-builder; then
            # docker buildx create \
            #   --name container-builder --driver docker-container \
            #   --buildkitd-flags "--allow-insecure-entitlement security.insecure --allow-insecure-entitlement network.host" \
            #   --platform linux/amd64,linux/arm64 --use
            echo "Docker Buildx it not configured correctly!"
            exit 1
          fi

      - name: Build and Publish
        env:
          HUB: ${{ env.IMAGE_REPOSITORY }}
          ISTIO_BASE_REGISTRY: ghcr.io/alauda-mesh
          BASE_VERSION: 2026-07-15T08-33-44
          TOOLS_REGISTRY_PROVIDER: registry.istio.io
          IMAGE_VERSION: release-1.30-ad8991a47cf3c61799caa5569b9458d95eb612f2
          # 关闭主模块 VCS 版本嵌入，消除 istio.io/istio 伪版本导致的 Trivy 误报（CVE-2021-39156 等）
          GOBUILDFLAGS: "-buildvcs=false"
          # For report_build_info.sh
          IGNORE_DIRTY_TREE: "1"
          GIT_DESCRIBE_TAG: ${{ env.TAG }}
          EXTRA_RELEASE_LDFLAGS: ${{ vars.EXTRA_RELEASE_LDFLAGS }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CI: "1"
        run: |
          # Install bom tool which is required for release-builder
          go install sigs.k8s.io/bom/cmd/bom@latest

          export WORK_DIR=/tmp/istio-build
          export S3_ENDPOINT=https://124f7899b936c5b3a37cdd5c22538c58.r2.cloudflarestorage.com
          export S3_BUCKET="istio-release"

          sudo rm -rf "${WORK_DIR}" && mkdir -p "${WORK_DIR}"
          ./alauda/release.sh

      - name: "Output image: ${{ env.IMAGE_REPOSITORY }}/proxyv2:${{ env.TAG }}-distroless"
        id: output_images
        shell: bash
        env:
          IMAGE_TAG: ${{ env.TAG }}
          PRIMARY_IMAGE: ${{ env.IMAGE_REPOSITORY }}/proxyv2:${{ env.TAG }}-distroless
          DOCKER_OUTPUT_DIR: /tmp/istio-build/out/docker
        run: |
          mapfile -t archives < <(
            find "${DOCKER_OUTPUT_DIR}" -maxdepth 1 -type f \
              -name '*.tar.gz' ! -name '*-arm64.tar.gz' -print | sort
          )
          if (( ${#archives[@]} == 0 )); then
            echo "No built images found in ${DOCKER_OUTPUT_DIR}" >&2
            exit 1
          fi

          images=()
          for archive in "${archives[@]}"; do
            image_name=$(basename "${archive}" .tar.gz)
            image_tag=${IMAGE_TAG}
            case "${image_name}" in
              *-debug)
                image_name=${image_name%-debug}
                image_tag=${IMAGE_TAG}-debug
                ;;
              *-distroless)
                image_name=${image_name%-distroless}
                image_tag=${IMAGE_TAG}-distroless
                ;;
            esac
            image="${IMAGE_REPOSITORY}/${image_name}:${image_tag}"
            images+=("${image}")
            echo "BUILD_IMAGE=${image}"
          done

          printf -v images_json '"%s",' "${images[@]}"
          images_json="[${images_json%,}]"
          echo "image=${PRIMARY_IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "images=${images_json}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Build images"
            echo
            printf -- '- `%s`\n' "${images[@]}"
          } >> "${GITHUB_STEP_SUMMARY}"
